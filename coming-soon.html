<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body class="font-sans bg-slate-950 text-slate-300 antialiased">

<main class="min-h-screen flex flex-col items-center justify-center px-5 relative overflow-hidden">
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 h-[400px] w-[700px] bg-indigo-600/20 blur-[130px] rounded-full pointer-events-none"></div>

  <div class="relative text-center max-w-xl">
    <a href="index.html" class="text-xs font-semibold text-slate-600 hover:text-indigo-400 transition">← launch collection</a>
    <p class="mt-8 text-indigo-400 font-semibold tracking-[0.35em] uppercase text-xs">Coming soon</p>
    <h1 class="mt-5 text-5xl md:text-7xl font-extrabold tracking-tight text-white">
      Waitly<span class="text-indigo-500">.</span>
    </h1>
    <p class="mt-6 text-lg text-slate-400">
      Something new for product launches is almost ready.<br class="hidden sm:block">
      Leave your email, be the first through the door.
    </p>

    <!-- Form: replace YOUR_FORM_ID with a real Formspree form ID -->
    <form action="https://formspree.io/f/xojgaokj" method="POST" class="mt-10 flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
      <label for="email" class="sr-only">Email address</label>
      <input id="email" type="email" name="email" required autocomplete="email" placeholder="you@email.com"
        class="flex-1 rounded-xl bg-white/5 border border-white/15 px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      <button type="submit" class="rounded-xl bg-indigo-600 px-7 py-3.5 font-bold text-white hover:bg-indigo-500 transition">
        Notify me
      </button>
    </form>
    <p class="mt-3 text-xs text-slate-600">One email when we launch. That's it.</p>

    <div class="mt-12 flex items-center justify-center gap-6 text-sm text-slate-500">
      <a href="#" class="hover:text-indigo-400 transition" aria-label="Twitter / X">𝕏</a>
      <a href="#" class="hover:text-indigo-400 transition" aria-label="Instagram">Instagram</a>
      <a href="#" class="hover:text-indigo-400 transition" aria-label="LinkedIn">LinkedIn</a>
    </div>
  </div>

  <footer class="absolute bottom-6 text-xs text-slate-700 text-center w-full px-5">
    A fictional product · portfolio project by <a href="https://github.com/FaaizaKarim" class="text-indigo-400 hover:underline">Faaiza Saand</a>
